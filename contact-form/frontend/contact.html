<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Submitted Contacts</title>

    <style>
        * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: "Segoe UI", Arial, sans-serif;
    min-height: 100vh;
    background: linear-gradient(135deg, #eef2ff, #f8fafc);
    padding: 50px 20px;
    color: #1e293b;
}

/* Main Container */
.container {
    width: 100%;
    max-width: 1100px;
    margin: auto;
}

/* Heading */
h1 {
    text-align: center;
    font-size: 38px;
    margin-bottom: 10px;
    color: #1e293b;
    letter-spacing: -1px;
}

h1::after {
    content: "";
    display: block;
    width: 70px;
    height: 4px;
    margin: 12px auto 30px;
    border-radius: 10px;
    background: #6366f1;
}

/* Result / Count */
#result {
    text-align: center;
    margin-bottom: 30px;
    font-size: 16px;
    color: #64748b;
}

/* Cards Grid */
.contacts {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
    gap: 24px;
}

/* Contact Card */
.contact-card {
    position: relative;
    background: rgba(255, 255, 255, 0.95);
    padding: 26px;
    border-radius: 18px;
    border: 1px solid #e2e8f0;
    box-shadow: 0 10px 30px rgba(15, 23, 42, 0.08);
    transition: all 0.3s ease;
    overflow: hidden;
}

/* Top line */
.contact-card::before {
    content: "";
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 5px;
    background: linear-gradient(90deg, #6366f1, #8b5cf6);
}

/* Hover Effect */
.contact-card:hover {
    transform: translateY(-7px);
    box-shadow: 0 18px 40px rgba(15, 23, 42, 0.14);
}

/* Name */
.contact-card h2 {
    font-size: 22px;
    margin-bottom: 18px;
    color: #312e81;
}

/* Text */
.contact-card p {
    margin: 9px 0;
    color: #475569;
    font-size: 15px;
    line-height: 1.6;
    word-break: break-word;
}

/* Labels */
.label {
    font-weight: 600;
    color: #1e293b;
}

/* Message Box */
.message {
    margin-top: 18px;
    padding: 15px;
    background: #f8fafc;
    border-left: 4px solid #6366f1;
    border-radius: 10px;
}

.message p {
    margin-top: 6px;
    color: #64748b;
}

/* Loading */
.loading {
    text-align: center;
    font-size: 18px;
    color: #6366f1;
}

/* Error */
.error {
    color: #dc2626 !important;
    text-align: center;
    font-weight: 500;
}

/* Mobile Responsive */
@media (max-width: 600px) {

    body {
        padding: 30px 15px;
    }

    h1 {
        font-size: 30px;
    }

    .contacts {
        grid-template-columns: 1fr;
    }

    .contact-card {
        padding: 22px;
    }
}
    </style>
</head>

<body>

    <div class="container">

        <h1>Submitted Contacts</h1>

        <p id="result">Loading contacts...</p>

        <div id="contacts" class="contacts"></div>

    </div>


    <script>

        const contactsContainer = document.getElementById("contacts");
        const result = document.getElementById("result");


        async function getContacts() {

            try {

                const response = await fetch(
                    "http://localhost:3000/submit-contact"
                );

                const data = await response.json();

                if (!data.success) {

                    result.textContent = data.message;
                    result.className = "error";

                    return;
                }


                if (data.contacts.length === 0) {

                    result.textContent = "No contacts found.";

                    return;
                }


                result.textContent = `${data.contacts.length} contact(s) found.`;


                data.contacts.forEach(contact => {

                    const card = document.createElement("div");

                    card.className = "contact-card";


                    card.innerHTML = `

                        <h2>${contact.name}</h2>

                        <p>
                            <span class="label">Email:</span>
                            ${contact.email}
                        </p>

                        <div class="message">
                            <span class="label">Message:</span>
                            <p>${contact.message}</p>
                        </div>

                    `;


                    contactsContainer.appendChild(card);

                });

            } catch (error) {

                console.log(error);

                result.textContent =
                    "Unable to load contacts.";

                result.className = "error";
            }
        }


        getContacts();

    </script>

</body>
</html>
